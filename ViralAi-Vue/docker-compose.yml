name: ruoyi

# -----------------------------------------------------------------------------
# RuoYi-Vue 一键部署：MySQL + Redis + 后端(ruoyi-admin) + 前端(Nginx)
#
#   docker compose up -d --build        首次启动（会编译前后端，耗时较长）
#   docker compose logs -f server       查看后端日志
#   docker compose down                 停止（保留数据卷）
#   docker compose down -v              停止并删除数据卷（会清空数据库！）
#
# 所有密码、端口都在同目录 .env 中覆盖，可参考 .env.example。
# 如需改用已有的 MySQL / Redis，删除对应 service，并把 DB_URL、REDIS_HOST 指向外部实例。
# -----------------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.0
    container_name: ruoyi-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ruoyi@2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ry}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化 SQL 源文件（只读挂载，供初始化脚本按序导入）
      - ./sql:/opt/ruoyi-sql:ro
      # 初始化脚本仅在数据卷为空时执行一次
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 走 TCP：初始化阶段 MySQL 只开 socket，端口通了才说明脚本已跑完
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --connect-timeout=2 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # 需要宿主机工具连库时再打开（注意与本机已装 MySQL 的 3306 冲突）
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"
    networks:
      - ruoyi-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ruoyi-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi@redis}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-ruoyi@redis}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ruoyi-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络可设为 https://maven.aliyun.com/repository/public
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: ruoyi-server:${TAG:-latest}
    container_name: ruoyi-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.timezone=Asia/Shanghai -Dfile.encoding=UTF-8}
      # 上传文件目录（与 logback 的 /home/ruoyi/logs 一起做持久化）
      RUOYI_PROFILE: /home/ruoyi/uploadPath
      # 数据库：容器内不启用 SSL，MySQL 8 的 caching_sha2_password 需要 allowPublicKeyRetrieval
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ry}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ruoyi@2026}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi@redis}
      REDIS_DATABASE: "0"
      # 令牌密钥：上线前务必改成随机长串
      TOKEN_SECRET: ${TOKEN_SECRET:-please-change-this-token-secret-in-production}
      # Druid 监控台账号
      DRUID_USERNAME: ${DRUID_USERNAME:-ruoyi}
      DRUID_PASSWORD: ${DRUID_PASSWORD:-ruoyi@druid}
    volumes:
      - ruoyi-upload:/home/ruoyi/uploadPath
      - ruoyi-logs:/home/ruoyi/logs
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - ruoyi-net
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: ${FRONTEND_DIR:-../RuoYi-Vue3}
      dockerfile: Dockerfile
      args:
        # 国内网络可设为 https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ruoyi-web:${TAG:-latest}
    container_name: ruoyi-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - ruoyi-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql-data:
  redis-data:
  ruoyi-upload:
  ruoyi-logs:

networks:
  ruoyi-net:
    driver: bridge
